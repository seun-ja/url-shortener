[package]
name = "url-shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = { version = "7.0.16", features = ["tracing", "tokio"] }
async-graphql-axum = "7.0.16"
axum = { version = "0.8.1", features = ["macros", "http2"] }
rand = "0.9.1"
tower-http = { version = "0.6.2", features = [
    "cors",
    "trace",
    "request-id",
    "compression-full",
] }
tokio = { version = "1.44.1", features = ["full", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
once_cell = "1.21.1"
dotenvy = "0.15.7"
envy = "0.4.2"

[profile.release]
lto = true
codegen-units = 1
